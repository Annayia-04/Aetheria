    <path d="M-30 -6 L-42 -24 L-18 -24 Z" fill="url(#goldGrad)" stroke="#b8963e" stroke-width="2"/>
    <path d="M30 -6 L42 -24 L18 -24 Z" fill="url(#goldGrad)" stroke="#b8963e" stroke-width="2"/>
    <rect x="-18" y="-22" width="36" height="16" rx="2" fill="url(#steelGrad)" stroke="#484858" stroke-width="2"/>
    <rect x="-8" y="-18" width="16" height="8" rx="1" fill="url(#goldGrad)" opacity="0.8"/>
    <g fill="#f5d99e" filter="drop-shadow(0 0 4px #f5d99e)">
      <circle cx="-24" cy="-32" r="4"/>
