<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Générateur d'icônes Aetheria</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 20px; background: #08070b; color: #f1eadc; }
    h1 { color: #e4bf70; font-family: Georgia, serif; }
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 20px; margin: 20px 0; }
    .icon-item { background: #16151d; border: 1px solid #2a2833; border-radius: 12px; padding: 16px; text-align: center; }
    .icon-item canvas { max-width: 100%; border-radius: 8px; border: 1px solid #c9a84c40; }
    .icon-item label { display: block; margin-top: 8px; font-size: 12px; color: #9f9588; }
    button { background: linear-gradient(180deg, #e4bf70 0%, #b8963e 100%); color: #08070b; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; margin: 8px; }
    button:hover { background: linear-gradient(180deg, #f5d99e 0%, #e4bf70 100%); }
    .log { background: #0d1b2a; border: 1px solid #2a2833; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🔨 Générateur d'icônes Aetheria</h1>
  <p>Cette page génère toutes les tailles d'icônes PNG nécessaires pour le manifest PWA.</p>

  <button id="generateAll">Générer toutes les icônes</button>
  <button id="downloadAll" disabled>Télécharger tout (ZIP)</button>

  <div class="icon-grid" id="iconGrid"></div>

  <h2>Log</h2>
  <div class="log" id="log">Prêt. Cliquez sur "Générer toutes les icônes".</div>

  <script>
    const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
    const logEl = document.getElementById('log');
    const gridEl = document.getElementById('iconGrid');
    const generated = {};

    function log(msg) {
      logEl.textContent += '\n' + msg;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function drawIcon(ctx, size) {
      const cx = size / 2;
      const cy = size / 2;
      const r = size * 0.45;

      // Fond
      const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.7);
      bgGrad.addColorStop(0, '#0d1b2a');
      bgGrad.addColorStop(1, '#08070b');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, size, size);

      // Cercle doré
      const goldGrad = ctx.createLinearGradient(0, 0, size, size);
      goldGrad.addColorStop(0, '#f5d99e');
      goldGrad.addColorStop(0.5, '#e4bf70');
      goldGrad.addColorStop(1, '#b8963e');
      ctx.strokeStyle = goldGrad;
      ctx.lineWidth = size * 0.025;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.45, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // Enclume
      const scale = size / 180;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);

      // Corps enclume
      const steelGrad = ctx.createLinearGradient(-90, -90, 90, 90);
      steelGrad.addColorStop(0, '#e8e8f0');
      steelGrad.addColorStop(1, '#a8a8c0');

      ctx.fillStyle = steelGrad;
      ctx.strokeStyle = '#484858';
      ctx.lineWidth = 3 * scale;

      // Base
      ctx.beginPath();
      ctx.roundRect(-40, 24, 80, 18, 6 * scale);
      ctx.fill();
      ctx.stroke();

      // Corps
      ctx.beginPath();
      ctx.roundRect(-30, -6, 60, 30, 4 * scale);
      ctx.fill();
      ctx.stroke();

      // Cornes
      const goldGrad2 = ctx.createLinearGradient(-40, -40, 40, 40);
      goldGrad2.addColorStop(0, '#f5d99e');
      goldGrad2.addColorStop(0.5, '#e4bf70');
      goldGrad2.addColorStop(1, '#b8963e');
      ctx.fillStyle = goldGrad2;
      ctx.strokeStyle = '#b8963e';
      ctx.lineWidth = 2 * scale;

      // Corne gauche
      ctx.beginPath();
      ctx.moveTo(-30, -6);
      ctx.lineTo(-42, -24);
      ctx.lineTo(-18, -24);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Corne droite
      ctx.beginPath();
      ctx.moveTo(30, -6);
      ctx.lineTo(42, -24);
      ctx.lineTo(18, -24);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Face
      ctx.fillStyle = steelGrad;
      ctx.strokeStyle = '#484858';
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.roundRect(-18, -22, 36, 16, 2 * scale);
      ctx.fill();
      ctx.stroke();

      // Détail central
      ctx.fillStyle = goldGrad2;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.roundRect(-8, -18, 16, 8, 1 * scale);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Étincelles
      ctx.fillStyle = '#f5d99e';
      ctx.shadowColor = '#f5d99e';
      ctx.shadowBlur = 4 * scale;
      [ [-24, -32], [24, -32], [0, -38], [-36, -12], [36, -12] ].forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, (x === 0 ? 3 : x === -36 || x === 36 ? 2.5 : 4) * scale, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      ctx.restore();

      // Particules
      ctx.fillStyle = '#e4bf70';
      ctx.globalAlpha = 0.4;
      ctx.shadowColor = '#e4bf70';
      ctx.shadowBlur = 3;
      [ [size * 0.15, size * 0.16], [size * 0.84, size * 0.21], [size * 0.19, size * 0.83], [size * 0.8, size * 0.79] ].forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, size * 0.017, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    async function generateAll() {
      gridEl.innerHTML = '';
      log('Démarrage de la génération...');

      for (const size of sizes) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        drawIcon(ctx, size);

        // Convertir en blob
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        generated[size] = blob;

        // Afficher
        const item = document.createElement('div');
        item.className = 'icon-item';
        item.innerHTML = `<canvas width="${size}" height="${size}"></canvas><label>${size}×${size}</label>`;
        item.querySelector('canvas').getContext('2d').drawImage(canvas, 0, 0);
        gridEl.appendChild(item);

        log(`✓ ${size}×${size} généré`);
      }

      log('\nToutes les icônes générées !');
      document.getElementById('downloadAll').disabled = false;
    }

    function downloadAll() {
      // Créer un ZIP simple (sans librairie externe, on télécharge individuellement)
      sizes.forEach(size => {
        const blob = generated[size];
        if (blob) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `icon-${size}.png`;
          a.click();
          URL.revokeObjectURL(url);
        }
      });
      log('Téléchargements lancés. Placez les fichiers dans assets/icons/');
    }

    document.getElementById('generateAll').addEventListener('click', generateAll);
    document.getElementById('downloadAll').addEventListener('click', downloadAll);

    // Polyfill pour roundRect
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
      };
    }
  </script>
</body>
</html>
